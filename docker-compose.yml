# Local production-like stack: PostgreSQL + API + web (nginx).
# Usage: docker compose up --build
# NOTE: this is deployment preparation — it is not exercised inside the
# development sandbox (no Docker available there).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentgraph
      POSTGRES_PASSWORD: talentgraph
      POSTGRES_DB: talentgraph
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://talentgraph:talentgraph@db:5432/talentgraph
      # Required — compose refuses to start when JWT_SECRET is unset/empty,
      # so a known default secret can never reach production by accident:
      #   export JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")"
      JWT_SECRET: ${JWT_SECRET:?Set the JWT_SECRET environment variable before running docker compose}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    # Persistent disk mount for uploads on hosts that support it:
    # volumes:
    #   - uploads:/app/server/uploads
    command: sh -c "npx prisma db push && node server/src/server.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
